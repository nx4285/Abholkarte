body{

}

.shell{
    display:grid;
    grid-template-columns:minmax(320px,420px) 1fr;
    height:calc(100dvh - 52px);
}

aside{
    overflow:auto;
    padding:12px;
}

.mapwrap{position:relative}

#map{
    width:100%;
    height:100%;

}

.card{

}

    display:flex;

    overflow-x:auto;

}

button{
    border:0;

.tab{

}

.tab.active{

    color:white;
}

input,textarea{
    width:100%;

    border-radius:10px;
    padding:11px;
    font-size:16px;
    margin:5px 0;

}

textarea{min-height:80px}

.row{

}

.row>*{flex:1}

.item{
    border-top:1px solid #eee;

}

.item:first-child{border-top:0}

.item h3{

    margin:0 0 4px;

.meta{

.price{font-weight:800}

.badge{

.toolbar{

.login{

.login .card{

}

.routebox{
    position:absolute;
    right:10px;
    top:10px;
    z-index:500;
    background:white;
    padding:10px;
    border-radius:12px;
    max-width:280px;
    box-shadow:0 2px 14px #0003;
}

.map-pin{
    width:24px;

    border-radius:50% 50% 50% 0;

.map-pin.red{background:#dc2626}
.map-pin.blue{background:#2563eb}
.map-pin.green{background:#16a34a}

.map-pin span{
    display:block;
    width:8px;

    margin:6px;

    background:white;
}

.share-status{
    background:#dcfce7;
    color:#166534;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
    font-size:13px;
    font-weight:600;
}

.share-status.error{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:800px){
    .shell{
        display:block;
        height:auto;
    }

    aside{padding-bottom:20px}

    .mapwrap{height:52dvh}

    #map{
        height:52dvh;
        min-height:350px;
    }
}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";

let ads=[];
let searches=[];
let markers=[];
let routeLayer=null;
let cfg={};
let userLocationMarker=null;

const $=id=>document.getElementById(id);

const map=L.map("map").setView([51.1,10.2],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"Â© OpenStreetMap"
}
).addTo(map);


async function api(url,options={}){

const response=await fetch(
url,
{
headers:{
"Content-Type":"application/json"
},
...options
}
);

const data=await response.json().catch(()=>({}));

if(
response.status===401 &&
data.error==="PIN_REQUIRED"
){
$("login").classList.remove("hidden");
throw new Error("PIN erforderlich");
}

if(!response.ok){
throw new Error(
data.error ||
data.message ||
"Fehler"
);
}

return data;
}


function esc(value){

return String(
value==null ? "" : value
).replace(
/[&<>"']/g,
char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
})[char]
);
}


function extractKleinanzeigenUrl(text){

const value=String(text||"").trim();

const match=value.match(
/https?:\/\/(?:www\.)?kleinanzeigen\.de\/[^\s]+/i
);

if(!match){
return value;
}

return match[0].replace(
/[.,;!?)\]}"]+$/g,
""
);
}


/*
Nur echte Autoanzeigen rot.

Die Kleinanzeigen-Kategorie wird aus dem Link gelesen.
Kategorie 216 = Autos.
*/

function isVehicle(ad){

const url=String(ad.url||"");
const source=String(ad.source||"").toLowerCase();

return (
/-216-\d+(?:[/?]|$)/.test(url) ||
/mobile\.de/i.test(url) ||
/autoscout24\.de/i.test(url) ||
source==="mobile.de" ||
source==="autoscout24"
);

}


function showUserLocation(){

if(!navigator.geolocation){
return;
}

navigator.geolocation.getCurrentPosition(
position=>{

const point=[
position.coords.latitude,
position.coords.longitude
];

if(userLocationMarker){
userLocationMarker.setLatLng(point);
return;
}

userLocationMarker=L.marker(
point,
{
icon:L.divIcon({
className:"",
html:'<div class="map-pin green"><span></span></div>',
iconSize:[24,24],
iconAnchor:[12,24],
popupAnchor:[0,-24]
})
}
).addTo(map);

userLocationMarker.bindPopup(
"<b>Mein Standort</b>"
);

},
error=>console.log(error),
{
enableHighAccuracy:true,
maximumAge:60000,
timeout:15000
}
);

}


function pinIcon(vehicle){

const color=vehicle ? "red" : "blue";

return L.divIcon({
className:"",
html:
'<div class="map-pin '+
color+
'"><span></span></div>',
iconSize:[24,24],
iconAnchor:[12,24],
popupAnchor:[0,-24]
});
}


/*
NEU:
Ãbergebene Anzeige aus ?share= erkennen.

Beispiel:

https://abholkarte.../?share=https%3A%2F%2Fwww.kleinanzeigen.de%2F...
*/

function getSharedUrl(){

const params=new URLSearchParams(
window.location.search
);

const shared=params.get("share");

if(!shared){
return "";
}

return extractKleinanzeigenUrl(
shared
);
}


/*
share= nach Verarbeitung aus der Browser-Adresse entfernen.

Dadurch wird die gleiche Anzeige beim Neuladen nicht
noch einmal importiert.
*/

function clearSharedUrl(){

try{

const cleanUrl=
window.location.origin+
window.location.pathname;

window.history.replaceState(
{},
document.title,
cleanUrl
);

}catch(error){
console.log(error);
}

}


function showShareStatus(text,error=false){

const box=$("shareStatus");

box.textContent=text;

box.classList.remove("hidden");

if(error){
box.classList.add("error");
}else{
box.classList.remove("error");
}

setTimeout(
()=>{
box.classList.add("hidden");
},
5000
);

}


/*
NEU:
Anzeige aus iPhone-Teilen-Funktion importieren.
*/

async function importSharedAd(){

const sharedUrl=getSharedUrl();

if(!sharedUrl){
return;
}

showShareStatus(
"Anzeige wird zur Abholliste hinzugefÃ¼gt â¦"
);

try{

const result=await api(
"/api/import/ad",
{
method:"POST",
body:JSON.stringify({
url:sharedUrl
})
}
);

clearSharedUrl();

await loadAll();

showShareStatus(
"â Anzeige wurde zur Abholliste hinzugefÃ¼gt."
);

if(result && result.id){
focusAd(result.id);
}

}catch(error){

clearSharedUrl();

showShareStatus(
"Import fehlgeschlagen: "+error.message,
true
);

}

}


async function boot(){

try{

cfg=await fetch(
"/api/config"
).then(
response=>response.json()
);

if(cfg.needs_pin){

$("login").classList.remove("hidden");

return;
}

await loadAll();

/*
Nach normalem Start prÃ¼fen,
ob der Kurzbefehl eine Anzeige Ã¼bergeben hat.
*/

await importSharedAd();

}catch(error){

console.error(error);

$("adlist").innerHTML=
'<div class="small">'+
esc(error.message)+
'</div>';

}

}


async function login(){

try{

await api(
"/api/login",
{
method:"POST",
body:JSON.stringify({
pin:$("pin").value
})
}
);

$("login").classList.add("hidden");

await loadAll();

/*
Auch nach PIN-Eingabe einen eventuell
Ã¼bergebenen Link verarbeiten.
*/

await importSharedAd();

}catch(error){

alert(error.message);

}

}


async function loadAll(){

try{

ads=await api("/api/ads");
searches=await api("/api/searches");

renderAds();
renderSearches();
updateSetupStatus();

setTimeout(
()=>map.invalidateSize(),
150
);

}catch(error){

console.error(error);

$("adlist").innerHTML=
'<div class="small">'+
esc(error.message)+
'</div>';

}

}


document.querySelectorAll(".tab").forEach(button=>{

button.addEventListener(
"click",
()=>{

document.querySelectorAll(".tab").forEach(
element=>element.classList.remove("active")
);

document.querySelectorAll(".pane").forEach(
element=>element.classList.add("hidden")
);

button.classList.add("active");

const pane=$(button.dataset.tab);

if(pane){
pane.classList.remove("hidden");
}

setTimeout(
()=>map.invalidateSize(),
100
);

}
);

});


function renderAds(){

markers.forEach(
marker=>map.removeLayer(marker)
);

markers=[];

const filterText=
$("filter").value.trim().toLowerCase();

const visible=ads.filter(ad=>{

const text=[
ad.title,
ad.place,
ad.price_text
]
.join(" ")
.toLowerCase();

return text.includes(filterText);

});

$("count").textContent=
visible.length+" Anzeigen";


if(!visible.length){

$("adlist").innerHTML=
'<div class="small">Noch keine Anzeigen.</div>';

}else{

$("adlist").innerHTML=
visible.map(ad=>{

const checked=
ad.selected ? "checked" : "";

const faded=
ad.deleted ? "inactive" : "";

const url=esc(ad.url||"");

return `
<div class="item ${faded}">

<div class="row">

<label style="flex:0">
<input
type="checkbox"
data-select-id="${ad.id}"
${checked}
style="width:auto"
>
</label>

<div>

<h3>
${esc(ad.title||"Ohne Titel")}
</h3>

<div class="meta">

<span class="price">
${esc(ad.price_text||"")}
</span>

Â· ${esc(ad.place||"Ort unbekannt")}

Â·

<span class="badge">
${esc(ad.source||"")}
</span>

</div>

</div>

</div>

<div class="toolbar">

<button
class="alt"
data-map-id="${ad.id}"
>
Karte
</button>

<button
class="alt"
data-open-url="${url}"
>
Anzeige
</button>

<button
class="warn"
data-delete-id="${ad.id}"
>
LÃ¶schen
</button>

</div>

</div>
`;

}).join("");

}


document
.querySelectorAll("[data-select-id]")
.forEach(element=>{

element.addEventListener(
"change",
()=>{

selectAd(
Number(element.dataset.selectId),
element.checked
);
}
);

});


document
.querySelectorAll("[data-map-id]")
.forEach(element=>{

element.addEventListener(
"click",
()=>{

focusAd(
Number(element.dataset.mapId)
);

}
);

});


document
.querySelectorAll("[data-open-url]")
.forEach(element=>{

element.addEventListener(
"click",
()=>{

const url=element.dataset.openUrl;

if(url){
window.open(url,"_blank");
}

}
);

});


document
.querySelectorAll("[data-delete-id]")
.forEach(element=>{

element.addEventListener(
"click",
()=>{

deleteAd(
Number(element.dataset.deleteId)
);

}
);

});


visible.forEach(ad=>{

const lat=Number(ad.lat);
const lon=Number(ad.lon);

if(
!Number.isFinite(lat) ||
!Number.isFinite(lon)
){
return;
}

const marker=L.marker(
[lat,lon],
{
opacity:
ad.deleted ? 0.45 : 1,

icon:
pinIcon(
isVehicle(ad)
)
}
)
.addTo(map);

marker.bindPopup(
"<b>"+
esc(ad.title||"")+
"</b><br>"+
esc(ad.price_text||"")+
"<br>"+
esc(ad.place||"")
);

marker._aid=ad.id;

markers.push(marker);

});

}


async function selectAd(id,value){

try{

await api(
"/api/ads/"+id,
{
method:"PATCH",
body:JSON.stringify({
selected:value ? 1 : 0
})
}
);

const ad=ads.find(
item=>Number(item.id)===Number(id)
);

if(ad){
ad.selected=value ? 1 : 0;
}

}catch(error){

alert(error.message);

}

}


async function selectVisible(){

const filterText=
$("filter").value.trim().toLowerCase();

const visible=ads.filter(ad=>{

return [
ad.title,
ad.place,
ad.price_text
]
.join(" ")
.toLowerCase()
.includes(filterText);

});

try{

for(const ad of visible){

await api(
"/api/ads/"+ad.id,
{
method:"PATCH",
body:JSON.stringify({
selected:1
})
}
);

}

await loadAll();

}catch(error){

alert(error.message);

}

}


function focusAd(id){

const ad=ads.find(
item=>Number(item.id)===Number(id)
);

if(!ad){
return;
}

const lat=Number(ad.lat);
const lon=Number(ad.lon);

if(
Number.isFinite(lat) &&
Number.isFinite(lon)
){

map.setView(
[lat,lon],
13
);

}

}


async function deleteAd(id){

if(
!confirm(
"Anzeige wirklich lÃ¶schen?"
)
){
return;
}

try{

await api(
"/api/ads/"+id,
{
method:"DELETE"
}
);

await loadAll();

}catch(error){

alert(error.message);

}

}


async function importAd(){

$("importmsg").textContent=
"Importiereâ¦";

try{

const url=
extractKleinanzeigenUrl(
$("adurl").value
);

if(
!url ||
!/^https?:\/\//i.test(url)
){

throw new Error(
"Kein Kleinanzeigen-Link gefunden."
);

}

const result=await api(
"/api/import/ad",
{
method:"POST",
body:JSON.stringify({
url:url
})
}
);

$("importmsg").textContent=
"Anzeige importiert.";

$("adurl").value="";

await loadAll();

if(result.id){
focusAd(result.id);
}

}catch(error){

$("importmsg").textContent=
error.message;

}

}


async function manualAd(){

try{

await api(
"/api/ads/manual",
{
method:"POST",
body:JSON.stringify({

title:$("mtitle").value,

price_text:$("mprice").value,

place:$("mplace").value,

url:
extractKleinanzeigenUrl(
$("murl").value
)

})
}
);

$("mtitle").value="";
$("mprice").value="";
$("mplace").value="";
$("murl").value="";

await loadAll();

alert(
"Anzeige gespeichert."
);

}catch(error){

alert(error.message);

}

}


async function addSearch(){

try{

const url=
extractKleinanzeigenUrl(
$("surl").value
);

if(!url){

throw new Error(
"Bitte einen Suchlink einfÃ¼gen."
);

}

const search=await api(
"/api/searches",
{
method:"POST",
body:JSON.stringify({

url:url,

name:
$("sname").value.trim()

})
}
);

$("surl").value="";
$("sname").value="";

await loadAll();

if(search.id){
await syncSearch(search.id);
}

}catch(error){

alert(error.message);

}

}


function renderSearches(){

if(!searches.length){

$("searches").innerHTML=
'<div class="small">Noch keine gespeicherten Suchen.</div>';

return;
}

$("searches").innerHTML=
searches.map(search=>{

return `
<div class="item">

<h3>
${esc(search.name||"Suche")}
</h3>

<div class="meta">
${esc(search.query||"")}
</div>

<div class="toolbar">

<button
data-sync-search="${search.id}"
>
Synchronisieren
</button>

<button
class="warn"
data-delete-search="${search.id}"
>
LÃ¶schen
</button>

</div>

</div>
`;

}).join("");


document
.querySelectorAll("[data-sync-search]")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

syncSearch(
Number(button.dataset.syncSearch)
);

}
);

});


document
.querySelectorAll("[data-delete-search]")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

deleteSearch(
Number(button.dataset.deleteSearch)
);

}
);

});

}


async function syncSearch(id){

try{

const result=await api(
"/api/searches/"+id+"/sync",
{
method:"POST",
body:JSON.stringify({
size:20
})
}
);

await loadAll();

alert(
(result.count||0)+
" Treffer synchronisiert."
);

}catch(error){

alert(error.message);

}

}


async function deleteSearch(id){

if(
!confirm(
"Gespeicherte Suche lÃ¶schen?"
)
){
return;
}

try{

await api(
"/api/searches/"+id,
{

async function planRoute(){

const ids=
ads
.filter(
ad=>ad.selected && !ad.deleted
)
.map(
ad=>ad.id
);

try{

const result=await api(
"/api/route",
{
method:"POST",
body:JSON.stringify({

start:$("rstart").value,

end:$("rend").value,

ad_ids:ids

})
}
);

if(routeLayer){

map.removeLayer(
routeLayer
);

}

routeLayer=
L.geoJSON(
result.geometry
).addTo(map);

if(
routeLayer.getBounds().isValid()
){

map.fitBounds(
routeLayer
.getBounds()
.pad(0.1)
);

}

$("routebox")
.classList
.remove("hidden");

$("routebox").innerHTML=
"<b>"+
esc(result.distance_km||"")+
" km Â· ca. "+
esc(result.duration_min||"")+
" min</b>"+
"<ol>"+
(result.order||[])
.map(
item=>
"<li>"+
esc(item.label||"")+
"</li>"
)
.join("")+
"</ol>";

}catch(error){

alert(error.message);

}

}

async function saveSettings(){

try{

const apiKey=
$("apikey").value.trim();

const newPin=
$("newpin").value.trim();

if(apiKey){
body.klaz_api_key=apiKey;
}

if(newPin){

if(newPin.length<4){

throw new Error(
"PIN muss mindestens 4 Zeichen haben."
);

}

body.app_pin=newPin;

}

await api(
"/api/settings",
{
method:"POST",
body:JSON.stringify(body)
}
);

$("newpin").value="";

await updateSetupStatus();

);

}catch(error){

}

}

/*
Liste automatisch neu laden, wenn die Abholkarte nach dem
iPhone-Kurzbefehl wieder in den Vordergrund kommt.
*/

let returnRefreshRunning=false;

async function refreshOnReturn(){

if(
document.hidden ||
returnRefreshRunning ||
!cfg ||
cfg.needs_pin
){
return;
}

returnRefreshRunning=true;

try{
await loadAll();
}catch(error){
console.error(error);
}finally{
returnRefreshRunning=false;
}

}

window.addEventListener(
"focus",
refreshOnReturn
);

document.addEventListener(
"visibilitychange",
()=>{
if(!document.hidden){
refreshOnReturn();
}
}
);

boot();
showUserLocation();
